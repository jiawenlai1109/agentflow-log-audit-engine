  - id: E25
    type: 多源分诊-缺表必须拒绝
    question: 生产域主机的异常告警有哪些？哪些需要立刻处置
    # 只给两张表：资产台账缺席 ⇒ "生产域"这个概念根本不存在于这批数据里
    data: sigma_missing_assets
    pack: sigma_triage
    added_at: "2026-09-28"
    mock:
      gate:
        # 立场：缺表时**拒绝出结论**并点名缺哪一列，而不是"能算几条算几条"。
        # 安全报告静默少一条加权规则，比一份没有结论的降级报告危险得多。
        status: degraded
        report_contains: ["必需列", "是否生产"]
        report_excludes: ["分诊队列", "全部规则未命中"]
      gap: {}
    real:
      gate:
        status: degraded
        report_contains: ["必需列", "是否生产"]

  # ---------------------------------------------------------------- 能力面（M4 骨架追加）
  # 这两题守的不是"能不能装载"，而是**装载了就必须生效、外部数据就必须只作证据**：
  # 一条没接上的能力链比没有这条链更危险——它会让门禁以为有人在守门。
  - id: E26
    type: 能力面-skill方法生效
    question: 最近7天每日销售额的走势如何？
    data: profit
    added_at: "2026-09-28"
    mock:
      gate:
        status: success
        # 两只 skill 都装上，且正文确实进了它点名的那个角色的 prompt（只查"装上"是假的）
        skills_active:
          installed: [chart_selection, cross_table_triage]
          injected:
            visualizer: [chart_selection]
            planner: [cross_table_triage]
            executor: [cross_table_triage]
        # L3 规则表被**确定性消费**的证据：趋势任务必须画成折线
        chart_type: { task: 2, expect: line }
        transcript_has: ["skill_injected", "skill_reference_read"]
        verifier: pass_all
        numbers_traceable_min: 0.9
      gap: {}
    real:
      gate:
        status: success
        chart_type: { task: 2, expect: line }
        skills_active: { installed: [chart_selection, cross_table_triage] }

  - id: E27
    type: 能力面-mcp外部证据只作证据
    question: 生产域主机的异常告警有哪些？哪些需要立刻处置
    data: sigma_attack
    pack: sigma_triage
    added_at: "2026-09-28"
    mock:
      gate:
        status: success
        # 外部情报到位（5 行 host/score）：这条红了说明整条 MCP 链没接上，而不是"数据不巧"
        external_evidence:
          server: soc_intel
          tool: query
          rows: 5
          columns: [host, score]
          evidence_only: true
        # 命中集合与 E21 **逐主体相同**：接了外部数据源，判定一个字都没变（I1+I2）
        subjects:
          rules:
            T1: ["203.0.113.7->admin"]
            T3: ["10.0.0.15", "10.0.0.21", "10.0.0.5", "10.0.0.7"]
            T4: ["10.0.0.15"]
        findings: { T1: 1, T3: 4, T4: 1 }
        verifier: pass_all
        critic: pass
        report_layers: { pack: sigma_triage }
        # 4242 只存在于外部情报库里。它出现在报告任何一处 = 外部数据成了数字来源 = 违反 I1，
        # 而这条断言就是那道闸门：真红了才说明"外部只作证据"这句话是有牙齿的。
        report_excludes: ["4242"]
        transcript_has: ["mcp_outbound", "mcp_result"]
        numbers_traceable_min: 0.9
      gap: {}
    real:
      gate:
        status: success
        external_evidence: { server: soc_intel, tool: query, rows: 5 }
        report_excludes: ["4242"]
