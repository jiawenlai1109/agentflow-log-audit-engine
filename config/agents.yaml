llm:
  model: ""                   # 留空 → 使用 .env 的 LLM_MODEL；显式填写才覆盖环境变量
  base_url: ""                # 留空则用 OPENAI_BASE_URL（默认 https://api.openai.com/v1）
  temperature: 0.2
  # thinking: disabled        # 思考档位（enabled / disabled / 留空=不发这个字段）。
  #                             真实模式踩过：思考档把 max_tokens 花在 reasoning 上时正文为空——
  #                             字面值实测有两种（null 与 空串），所以判据按签名走：
  #                             "reasoning 在场 + finish_reason=length" 才算交白卷（#41/#42）。
  #                             留空是为了不改变默认请求体——上游认不认 thinking 需要实测，
  #                             "配置写了"不等于"思考关了"。
  # fallback_models: []       # 型号降级链，默认空=完全不启用。只在三种失败下换下一个型号：
  #                             白卷签名对 / 传输层错误或超时 / 5xx+429 重试用尽。
  #                             401、403、404、非 JSON 响应（网关配额页）、结构异常、预算耗尽
  #                             ——一律不换：换个型号一个字都不会变，降级只会多烧一次钱并把真因洗白。
  #                             开着它要注意两件事：① 每次降级都落 evaluation.json 的 llm_fallbacks
  #                             与 transcript 的 llm_fallback 事件，实际服务过的型号集合记在 models_used；
  #                             ② 真实 HTTP 次数会多于 llm_calls（逻辑调用数），看 llm_http_attempts。

execution:
  max_concurrency: 3
  task_timeout_seconds: 30
  total_budget_seconds: 120
  max_llm_calls: 30
  max_executor_attempts: 3
  max_inspector_redos: 3
  max_review_rounds: 2
  allow_partial_results: true

agents:
  explorer:
    tools: [profile_bundle, "mcp:soc_intel:query"]   # 外部只读证据：白名单是第二道，server 侧 allowed_agents 是第一道
    temperature: 0.2
    max_tokens: 800
  planner:
    tools: []
    temperature: 0.2
    max_tokens: 1500
  executor:
    tools: [execute_python, read_artifact]
    temperature: 0.1
    max_tokens: 2000
    # model: deepseek-v4-pro   # 可选：单独给 Executor 指定模型（覆盖全局）；型号名以 GET /models 为准
  inspector:
    tools: [validate_rules, verify_aggregate, verify_findings]
    temperature: 0.2
    max_tokens: 500
  visualizer:
    tools: [execute_python, read_artifact]
    temperature: 0.1
    max_tokens: 1500
  reporter:
    tools: []
    temperature: 0.4
    max_tokens: 2000
  critic:
    tools: [check_report]
    temperature: 0.3
    max_tokens: 800

# 方法（skill）开关。关掉一只 = 系统失去那套方法，行为变化必须被门禁量到（见 core/skill.py）。
# 名单里写的是 skill 的 name 字段，不是目录名；关掉的名单与原因会进 transcript + evaluation.json。
skills:
  disabled: []
