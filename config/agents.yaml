llm:
  model: ""                   # 留空 → 使用 .env 的 LLM_MODEL；显式填写才覆盖环境变量
  base_url: ""                # 留空则用 OPENAI_BASE_URL（默认 https://api.openai.com/v1）
  temperature: 0.2

execution:
  max_concurrency: 3
  task_timeout_seconds: 30
  total_budget_seconds: 120
  max_llm_calls: 30
  max_executor_attempts: 3
  max_inspector_redos: 3
  max_review_rounds: 2
  allow_partial_results: true

agents:
  explorer:
    tools: [profile_csv]
    temperature: 0.2
    max_tokens: 800
  planner:
    tools: []
    temperature: 0.2
    max_tokens: 1500
  executor:
    tools: [execute_python, read_artifact]
    temperature: 0.1
    max_tokens: 2000
    # model: deepseek-coder   # 可选：单独给 Executor 指定模型（覆盖全局）
  inspector:
    tools: [validate_rules, verify_aggregate, verify_findings]
    temperature: 0.2
    max_tokens: 500
  visualizer:
    tools: [execute_python, read_artifact]
    temperature: 0.1
    max_tokens: 1500
  reporter:
    tools: []
    temperature: 0.4
    max_tokens: 2000
  critic:
    tools: [check_report]
    temperature: 0.3
    max_tokens: 800
